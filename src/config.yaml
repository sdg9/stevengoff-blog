site:
  name: My Awesome Site
  site: https://example.com
  base: /
  trailingSlash: false
  googleSiteVerificationId: ""
  contact:
    address: ""
    phone: ""
    email: ""
  contactForm:
    formEndpoint: https://forms.webtownhero.com/contact
    formId: bluerainlily
  goHighLevel:
    iframeDomain: https://brand.webtownhero.com
metadata:
  title:
    default: My Awesome Site
    template: "%s — My Awesome Site"
  description: A modern, fast, and accessible website built with Astro and Tailwind CSS.
  robots:
    index: true
    follow: true
  openGraph:
    site_name: My Awesome Site
    images:
      - url: ~/assets/images/default.png
        width: 1200
        height: 628
    type: website
  twitter:
    handle: "@onwidget"
    site: "@onwidget"
    cardType: summary_large_image
i18n:
  language: en
  textDirection: ltr
apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: /%slug%
      robots:
        index: true
    list:
      isEnabled: true
      pathname: blog
      robots:
        index: true
    category:
      isEnabled: true
      pathname: category
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: tag
      robots:
        index: false
    isRelatedPostsEnabled: true
    relatedPostsCount: 4
analytics:
  useCookieConsent: false
  vendors:
    googleAnalytics:
      id: null
    plausible:
      domain: null
      src: null
ui:
  theme: system
